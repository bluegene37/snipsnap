name: 🐛 Bug Report
description: Report an issue or unexpected behavior in snipsnap
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: dropdown
    id: platform
    attributes:
      label: Operating System
      description: What operating system are you running snipsnap on?
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux (Ubuntu/Debian)
        - Linux (Other)
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App Version
      description: Which version of snipsnap are you using? (e.g. 1.0.0)
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. Press 'Cmd+Shift+X' to start capture
        2. Draw a rectangle annotation
        3. Change opacity slider to 50%
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs_or_screenshots
    attributes:
      label: Screenshots or Logs
      description: Attach screenshots, screen recordings, or terminal output if applicable.
