name: Release

on:
  push:
    tags: ['v*']
  # workflow_dispatch:
  # Gene - Nov, 13, 2026: Added optional tag input for manual workflow_dispatch runs (auto-resolves from pubspec.yaml when omitted).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.7). Defaults to v<version> from pubspec.yaml.'
        required: false
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  windows:
    name: Build & Package Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Gene - Nov, 20, 2026: Provision Rust toolchain for snipsnap_core Windows staticlib.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/snipsnap_core

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Gene - Nov, 24, 2026: Build and test native Rust snipsnap_core before flutter test so FFI tests find snipsnap_core.dll.
      - name: Build & test Rust native core
        shell: bash
        run: cargo build --manifest-path native/snipsnap_core/Cargo.toml --release && cargo test --manifest-path native/snipsnap_core/Cargo.toml --release -- --nocapture

      - name: Install dependencies
        shell: bash
        run: bash scripts/ci_retry.sh flutter pub get

      - name: Run test suite
        shell: bash
        run: bash scripts/ci_retry.sh flutter test

      - name: Build Windows release
        shell: bash
        run: bash scripts/ci_retry.sh flutter build windows --release

      # Code signing for application binary (if WINDOWS_CERT_BASE64 is configured)
      - name: Sign application binary
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 || secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD || secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_BASE64)) {
            Write-Host "WINDOWS_CERT_BASE64 secret is not configured. Skipping application binary signing." -ForegroundColor Yellow
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "windows_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          try {
            # Gene - Nov, 22, 2026: Sign bundled snipsnap_core.dll alongside snipsnap.exe.
            # Old implementation:
            # $runnerExe = "build/windows/x64/runner/Release/snipsnap.exe"
            # if (Test-Path $runnerExe) {
            #   .\scripts\sign_windows.ps1 -CertPath $certPath -CertPassword "$env:WINDOWS_CERT_PASSWORD" -TargetPath $runnerExe
            # }
            foreach ($bin in @("build/windows/x64/runner/Release/snipsnap.exe", "build/windows/x64/runner/Release/snipsnap_core.dll")) {
              if (Test-Path $bin) {
                .\scripts\sign_windows.ps1 -CertPath $certPath -CertPassword "$env:WINDOWS_CERT_PASSWORD" -TargetPath $bin
              }
            }
          } finally {
            if (Test-Path $certPath) { Remove-Item -Force $certPath }
          }

      - name: Package Inno Setup installer
        run: dart run inno_bundle:build --release --no-app

      # Code signing for installer executable (if WINDOWS_CERT_BASE64 is configured)
      - name: Sign installer executable
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 || secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD || secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_BASE64)) {
            Write-Host "WINDOWS_CERT_BASE64 secret is not configured. Skipping installer signing." -ForegroundColor Yellow
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "windows_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          try {
            $installerExes = Get-ChildItem -Path "build/windows/x64/installer/Release/*.exe", "build/windows/x64/installer/*.exe" -ErrorAction SilentlyContinue
            foreach ($exe in $installerExes) {
              .\scripts\sign_windows.ps1 -CertPath $certPath -CertPassword "$env:WINDOWS_CERT_PASSWORD" -TargetPath $exe.FullName
            }
          } finally {
            if (Test-Path $certPath) { Remove-Item -Force $certPath }
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/windows/x64/installer/Release/*.exe
          if-no-files-found: error

  macos:
    name: Build & Package macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Gene - Nov, 20, 2026: Provision Rust universal macOS targets for snipsnap_core staticlib.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/snipsnap_core

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Gene - Nov, 24, 2026: Build and test native Rust snipsnap_core before flutter test so FFI tests find libsnipsnap_core.dylib.
      - name: Build & test Rust native core
        run: cargo build --manifest-path native/snipsnap_core/Cargo.toml --release && cargo test --manifest-path native/snipsnap_core/Cargo.toml --release -- --nocapture

      - name: Install dependencies
        run: bash scripts/ci_retry.sh flutter pub get

      - name: Run test suite
        run: bash scripts/ci_retry.sh flutter test

      # Gene - Nov, 24, 2026: Configure temporary macOS Developer ID keychain, sign .app + .dmg, notarize + staple via Apple notarytool, and clean up keychain/keys.
      # Old implementation:
      # - name: Build and package macOS DMG
      #   run: bash scripts/ci_retry.sh bash scripts/build_macos_dmg.sh
      - name: Configure macOS Developer ID signing & notarization
        shell: bash
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -z "${MACOS_CERT_BASE64:-}" ]; then
            echo "::warning::MACOS_CERT_BASE64 secret is not configured. Skipping macOS Developer ID signing & notarization (ad-hoc build only)."
            exit 0
          fi

          if [ -z "${MACOS_CERT_PASSWORD:-}" ]; then
            echo "Error: MACOS_CERT_PASSWORD secret is required when MACOS_CERT_BASE64 is configured." >&2
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/macos_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/snipsnap-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 32)"

          printf '%s' "$MACOS_CERT_BASE64" | tr -d '\r\n[:space:]' | base64 -D > "$CERT_PATH"
          chmod 600 "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          EXISTING_KEYCHAINS=()
          while IFS= read -r kc; do
            kc="${kc#"${kc%%[![:space:]]*}"}"
            kc="${kc%\"}"
            kc="${kc#\"}"
            if [ -n "$kc" ] && [ "$kc" != "$KEYCHAIN_PATH" ]; then
              EXISTING_KEYCHAINS+=("$kc")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Developer ID Application"; then
            echo "Developer ID intermediate certificate missing or chain incomplete; fetching DeveloperIDG2CA.cer..."
            G2_CER="$RUNNER_TEMP/DeveloperIDG2CA.cer"
            curl -fsSL "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o "$G2_CER"
            security import "$G2_CER" -k "$KEYCHAIN_PATH"
            rm -f "$G2_CER"
          fi

          if [ -z "${MACOS_SIGN_IDENTITY:-}" ]; then
            MACOS_SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/ {print $2; exit}')"
          fi
          if [ -z "${MACOS_SIGN_IDENTITY:-}" ]; then
            echo "Error: No valid Developer ID Application identity found in $KEYCHAIN_PATH." >&2
            exit 1
          fi

          {
            echo "MACOS_SIGN_KEYCHAIN=$KEYCHAIN_PATH"
            echo "MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY"
            echo "MACOS_SIGN_TIMESTAMP=1"
          } >> "$GITHUB_ENV"

          if [ -n "${APPLE_API_KEY_BASE64:-}" ]; then
            API_KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | tr -d '\r\n[:space:]' | base64 -D > "$API_KEY_PATH"
            chmod 600 "$API_KEY_PATH"
            echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
          fi

      - name: Build and package macOS DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/ci_retry.sh bash scripts/build_macos_dmg.sh

      - name: Clean up macOS signing keychain & temporary keys
        if: always()
        shell: bash
        run: |
          KEYCHAIN_TO_DELETE="${MACOS_SIGN_KEYCHAIN:-$RUNNER_TEMP/snipsnap-signing.keychain-db}"
          if [ -e "$KEYCHAIN_TO_DELETE" ]; then
            security delete-keychain "$KEYCHAIN_TO_DELETE" >/dev/null 2>&1 || rm -f "$KEYCHAIN_TO_DELETE"
          fi
          rm -f "$RUNNER_TEMP/macos_cert.p12" "$RUNNER_TEMP/apple_api_key.p8" "$RUNNER_TEMP/DeveloperIDG2CA.cer"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/macos/*.dmg
          if-no-files-found: error

  # Gene - Oct, 14, 2026: Microsoft Store MSIX package. Built unsigned with
  # --store (Partner Center re-signs on ingestion). Download the
  # `microsoft-store-msix` artifact and upload it in Partner Center →
  # SnipSnap → Submission → Packages.
  # msix:
  #   name: Build Microsoft Store MSIX
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v5
  #
  #     - uses: subosito/flutter-action@v2
  #       with:
  #         flutter-version: ${{ env.FLUTTER_VERSION }}
  #         channel: stable
  #         cache: true
  #
  #     - name: Install dependencies
  #       shell: bash
  #       run: bash scripts/ci_retry.sh flutter pub get
  #
  #     - name: Build Store MSIX
  #       run: dart run msix:create --store
  #
  #     - name: Upload Store MSIX artifact
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: microsoft-store-msix
  #         path: build/windows/msix/*.msix
  #         if-no-files-found: error

  # Gene - Oct, 31, 2026: Reverted automated msstore publish steps that caused GitHub Actions
  # startup_failure due to invalid use of secrets in if: conditionals.
  # The unsigned Store MSIX package is built and uploaded as the `microsoft-store-msix` artifact
  # for manual submission in Microsoft Partner Center.
  msix:
    # Gene - Nov, 23, 2026: Re-enabled automated Microsoft Store MSIX publishing via msstore CLI v0.4+ (using env checks instead of secrets in if:).
    # name: Build Microsoft Store MSIX
    name: Build & Publish Microsoft Store MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Gene - Nov, 20, 2026: Provision Rust toolchain for snipsnap_core MSIX build.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/snipsnap_core

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Gene - Nov, 24, 2026: Build and test native Rust snipsnap_core before flutter test so FFI tests find snipsnap_core.dll.
      - name: Build & test Rust native core
        shell: bash
        run: cargo build --manifest-path native/snipsnap_core/Cargo.toml --release && cargo test --manifest-path native/snipsnap_core/Cargo.toml --release -- --nocapture

      - name: Install dependencies
        shell: bash
        run: bash scripts/ci_retry.sh flutter pub get

      - name: Build Store MSIX
        run: dart run msix:create --store

      # Gene - Nov, 22, 2026: Verify critical binaries (including snipsnap_core.dll) and manifest are packaged inside the Store MSIX.
      - name: Verify Store MSIX contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $msix = Get-ChildItem -Path "build/windows/msix/*.msix" | Select-Object -First 1
          if (-not $msix) {
            throw "No MSIX file found in build/windows/msix/"
          }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName.ToLowerInvariant() }
            foreach ($req in @("snipsnap.exe", "snipsnap_core.dll", "flutter_windows.dll", "appxmanifest.xml")) {
              if (-not ($entries -contains $req)) {
                throw "Store MSIX $($msix.Name) is missing required entry: $req"
              }
            }
            Write-Host "Verified Store MSIX ($($msix.Name)) contains all required entries."
          } finally {
            $zip.Dispose()
          }

      - name: Upload Store MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-msix
          path: build/windows/msix/*.msix
          if-no-files-found: error

      # Gene - Oct, 28, 2026: Automated Microsoft Store CLI publishing (commented out to avoid workflow startup_failure).
      # - name: Setup Microsoft Store CLI
      #   uses: microsoft/microsoft-store-apppublisher@v1
      #
      # - name: Publish to Microsoft Store
      #   shell: pwsh
      #   env:
      #     TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      #     SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
      #     CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
      #     CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
      #     PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
      #   run: |
      #     msstore reconfigure `
      #       --tenantId "$env:TENANT_ID" `
      #       --sellerId "$env:SELLER_ID" `
      #       --clientId "$env:CLIENT_ID" `
      #       --clientSecret "$env:CLIENT_SECRET"
      #
      #     $msixFile = Get-ChildItem -Path "build/windows/msix/*.msix" | Select-Object -First 1
      #     if (-not $msixFile) {
      #       Write-Error "No MSIX file found in build/windows/msix/"
      #       exit 1
      #     }
      #
      #     Write-Host "Publishing $($msixFile.FullName) to Store Product ID: $env:PRODUCT_ID"
      #     msstore publish --path "$($msixFile.FullName)" --appId "$env:PRODUCT_ID"

      # Gene - Nov, 23, 2026: Automated Microsoft Store publishing using microsoft-store-apppublisher@v1.4 and positional msstore publish syntax.
      - name: Setup Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Publish to Microsoft Store
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TENANT_ID) -or
              [string]::IsNullOrWhiteSpace($env:SELLER_ID) -or
              [string]::IsNullOrWhiteSpace($env:CLIENT_ID) -or
              [string]::IsNullOrWhiteSpace($env:CLIENT_SECRET) -or
              [string]::IsNullOrWhiteSpace($env:PRODUCT_ID)) {
            Write-Host "Microsoft Store secrets are not fully configured. Skipping Microsoft Store publish." -ForegroundColor Yellow
            exit 0
          }

          msstore reconfigure `
            --tenantId "$env:TENANT_ID" `
            --sellerId "$env:SELLER_ID" `
            --clientId "$env:CLIENT_ID" `
            --clientSecret "$env:CLIENT_SECRET"
          if ($LASTEXITCODE -ne 0) {
            throw "msstore reconfigure failed with exit code $LASTEXITCODE"
          }

          $msixFile = Get-ChildItem -Path "build/windows/msix/*.msix" | Select-Object -First 1
          if (-not $msixFile) {
            throw "No MSIX file found in build/windows/msix/"
          }

          Write-Host "Publishing $($msixFile.FullName) to Microsoft Store..."
          msstore publish "$($msixFile.FullName)" --appId "$env:PRODUCT_ID"
          if ($LASTEXITCODE -ne 0) {
            throw "msstore publish failed with exit code $LASTEXITCODE"
          }

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Gene - Nov, 13, 2026: Resolve tag_name explicitly so workflow_dispatch works as well as v* tag pushes.
    # Old implementation:
    # steps:
    #   - name: Download release artifacts
    #     uses: actions/download-artifact@v4
    #     with:
    #       path: release-artifacts
    #       merge-multiple: true
    #
    #   - name: Publish GitHub Release
    #     uses: softprops/action-gh-release@v2
    #     with:
    #       # files: release-artifacts/*
    #       # Gene - Oct, 14, 2026: Only publish the installer + DMG; the
    #       # Store MSIX is unsigned and is for Partner Center only.
    #       files: |
    #         release-artifacts/*.exe
    #         release-artifacts/*.dmg
    #       generate_release_notes: true
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
            [[ "$TAG" == v* ]] || TAG="v$TAG"
          else
            VER="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\)+.*/\1/p' pubspec.yaml | head -1)"
            if [[ -z "$VER" ]]; then
              echo "Error: could not determine version from pubspec.yaml" >&2
              exit 1
            fi
            TAG="v$VER"
          fi
          echo "Resolved release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          # Gene - Oct, 14, 2026: Only publish the installer + DMG; the
          # Store MSIX is unsigned and is for Partner Center only.
          files: |
            release-artifacts/*.exe
            release-artifacts/*.dmg
          generate_release_notes: true
