name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  windows:
    name: Build & Package Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        shell: bash
        run: bash scripts/ci_retry.sh flutter pub get

      - name: Run test suite
        shell: bash
        run: bash scripts/ci_retry.sh flutter test

      - name: Build Windows release
        shell: bash
        run: bash scripts/ci_retry.sh flutter build windows --release

      # Code signing for application binary (if WINDOWS_CERT_BASE64 is configured)
      - name: Sign application binary
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 || secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD || secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_BASE64)) {
            Write-Host "WINDOWS_CERT_BASE64 secret is not configured. Skipping application binary signing." -ForegroundColor Yellow
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "windows_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          try {
            $runnerExe = "build/windows/x64/runner/Release/snipsnap.exe"
            if (Test-Path $runnerExe) {
              .\scripts\sign_windows.ps1 -CertPath $certPath -CertPassword "$env:WINDOWS_CERT_PASSWORD" -TargetPath $runnerExe
            }
          } finally {
            if (Test-Path $certPath) { Remove-Item -Force $certPath }
          }

      - name: Package Inno Setup installer
        run: dart run inno_bundle:build --release --no-app

      # Code signing for installer executable (if WINDOWS_CERT_BASE64 is configured)
      - name: Sign installer executable
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 || secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD || secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_BASE64)) {
            Write-Host "WINDOWS_CERT_BASE64 secret is not configured. Skipping installer signing." -ForegroundColor Yellow
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "windows_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          try {
            $installerExes = Get-ChildItem -Path "build/windows/x64/installer/Release/*.exe", "build/windows/x64/installer/*.exe" -ErrorAction SilentlyContinue
            foreach ($exe in $installerExes) {
              .\scripts\sign_windows.ps1 -CertPath $certPath -CertPassword "$env:WINDOWS_CERT_PASSWORD" -TargetPath $exe.FullName
            }
          } finally {
            if (Test-Path $certPath) { Remove-Item -Force $certPath }
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/windows/x64/installer/Release/*.exe
          if-no-files-found: error

  macos:
    name: Build & Package macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: bash scripts/ci_retry.sh flutter pub get

      - name: Run test suite
        run: bash scripts/ci_retry.sh flutter test

      - name: Build and package macOS DMG
        run: bash scripts/ci_retry.sh bash scripts/build_macos_dmg.sh

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/macos/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
