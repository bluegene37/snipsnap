name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  validate:
    name: Lint, Test & Build Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        shell: bash
        run: bash scripts/ci_retry.sh flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify static analysis
        run: flutter analyze --fatal-infos

      - name: Run test suite
        shell: bash
        run: bash scripts/ci_retry.sh flutter test

      - name: Validate Windows release build
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/ci_retry.sh flutter build windows --release

      - name: Validate macOS release build
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/ci_retry.sh flutter build macos --release
