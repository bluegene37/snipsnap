name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  validate:
    name: Lint, Test & Build Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # Gene - Nov, 20, 2026: Provision Rust toolchain for native snipsnap_core staticlib and run Rust unit/benchmark tests.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/snipsnap_core

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Run Rust native core tests
        shell: bash
        run: cargo test --manifest-path native/snipsnap_core/Cargo.toml --release -- --nocapture

      - name: Install dependencies
        shell: bash
        run: bash scripts/ci_retry.sh flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify static analysis
        run: flutter analyze --fatal-infos

      - name: Run test suite
        shell: bash
        run: bash scripts/ci_retry.sh flutter test

      - name: Validate Windows release build
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/ci_retry.sh flutter build windows --release

      - name: Validate macOS release build
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/ci_retry.sh flutter build macos --release
