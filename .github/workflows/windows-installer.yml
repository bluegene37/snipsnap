# Builds the Windows installer on a GitHub-hosted Windows runner, so you can
# produce something to hand to someone without owning a Windows machine.
#
# Run it from the Actions tab (Run workflow), or push a v* tag. The installer
# comes out as a downloadable artifact on the run's summary page.

name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Preinstalled on the current runner images, but pinning it here means the
      # workflow does not silently break if that changes.
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File windows/installer/build_installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: SnipSnap-windows-installer
          path: dist/*.exe
          if-no-files-found: error
